{% if employee_data %}
    {% for item in employee_data %}
        {% include "partials/employee_card.html" with data=item %}
    {% endfor %}
{% else %}
    <div class="col-span-full text-center py-10 bg-white shadow rounded-lg border border-gray-200">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No record found</h3>
        <p class="mt-1 text-sm text-gray-500">We couldn't find anyone matching "{{ query }}".</p>
        <div class="mt-6">
            <button type="button" onclick="document.getElementById('add-employee-section').classList.remove('hidden'); window.scrollTo(0, 0);" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                <svg class="-ml-1 mr-2 h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Add New Employee
            </button>
        </div>
    </div>
{% endif %}
