<div class="px-4 py-5 sm:p-6 text-center">
    <svg class="mx-auto h-12 w-12 text-green-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
    <h3 class="text-lg leading-6 font-medium text-gray-900">Employee Added Successfully!</h3>
    <p class="mt-2 text-sm text-gray-500">
        {{ employee.full_name }} ({{ employee.department }}) is now registered.
    </p>
    <div class="mt-6 flex justify-center gap-4">
        <button onclick="document.getElementById('add-employee-section').classList.add('hidden'); window.location.reload();" class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Close
        </button>
        <!-- The Instant Clock In Button: Triggers the toggle HTMX, then reloads the page to show the updated grid state (since we are replacing the add form with this) -->
        <button hx-post="{% url 'core:toggle_attendance' employee.id %}" 
                hx-swap="none" 
                hx-on::after-request="window.location.reload()"
                class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Clock Them In Now
        </button>
    </div>
</div>
